name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PLUGINVAL_VERSION: v1.0.4
  PLUGINVAL_STRICTNESS: 5

jobs:
  macos:
    name: macOS (universal, VST3 + AU + Standalone)
    runs-on: macos-latest
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      - uses: actions/checkout@v7

      - name: Cache dependency archives
        uses: actions/cache@v6
        with:
          path: .deps-cache
          key: deps-${{ hashFiles('CMakeLists.txt') }}

      - name: Install Ninja
        run: command -v ninja || brew install ninja

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Unit + render tests
        run: ctest --test-dir build --output-on-failure

      - name: Verify universal binaries
        run: |
          for b in VST3/reLoad.vst3 AU/reLoad.component Standalone/reLoad.app; do
            archs=$(lipo -archs "build/reLoad_artefacts/Release/$b/Contents/MacOS/reLoad")
            echo "$b: $archs"
            [[ "$archs" == *x86_64* && "$archs" == *arm64* ]]
          done

      - name: pluginval (VST3)
        run: |
          curl -sSL -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/download/${PLUGINVAL_VERSION}/pluginval_macOS.zip"
          echo "3c4c533bda0c5059eea3ddaea752d757ee2025041f0f47e6bcb0e87f6082b29f  pluginval.zip" | shasum -a 256 -c -
          unzip -q pluginval.zip
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level "${PLUGINVAL_STRICTNESS}" --timeout-ms 300000 \
            --validate build/reLoad_artefacts/Release/VST3/reLoad.vst3

      - name: auval (AU)
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          ditto build/reLoad_artefacts/Release/AU/reLoad.component ~/Library/Audio/Plug-Ins/Components/reLoad.component
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          auval -strict -v aumu Rlod Rlda

      - name: Package
        run: |
          mkdir -p dist
          cd build/reLoad_artefacts/Release
          ditto -c -k --keepParent VST3/reLoad.vst3 "$GITHUB_WORKSPACE/dist/reLoad-macOS-VST3.zip"
          ditto -c -k --keepParent AU/reLoad.component "$GITHUB_WORKSPACE/dist/reLoad-macOS-AU.zip"
          ditto -c -k --keepParent Standalone/reLoad.app "$GITHUB_WORKSPACE/dist/reLoad-macOS-Standalone.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: reLoad-macOS
          path: dist/*.zip
          if-no-files-found: error

  windows:
    name: Windows (x64 MSVC, VST3 + Standalone)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cache dependency archives
        uses: actions/cache@v6
        with:
          path: .deps-cache
          key: deps-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Unit + render tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: pluginval (VST3)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/Tracktion/pluginval/releases/download/$env:PLUGINVAL_VERSION/pluginval_Windows.zip" -OutFile pluginval.zip
          $hash = (Get-FileHash pluginval.zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne "c08e61ce3b96db41636f8ec7e76f4c7e2c13ebdac7fa1b5a1f52b4f32ec715ab") { throw "pluginval hash mismatch: $hash" }
          Expand-Archive pluginval.zip -DestinationPath pluginval
          .\pluginval\pluginval.exe --strictness-level $env:PLUGINVAL_STRICTNESS --timeout-ms 300000 --validate build\reLoad_artefacts\Release\VST3\reLoad.vst3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path build\reLoad_artefacts\Release\VST3\reLoad.vst3 -DestinationPath dist\reLoad-Windows-VST3.zip
          Compress-Archive -Path build\reLoad_artefacts\Release\Standalone\reLoad.exe -DestinationPath dist\reLoad-Windows-Standalone.zip

      - uses: actions/upload-artifact@v7
        with:
          name: reLoad-Windows-untested
          path: dist/*.zip
          if-no-files-found: error
